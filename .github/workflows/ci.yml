name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-coverage:
    name: Test & Code Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install API Client dependencies
        working-directory: ./api-client
        run: npm ci

      - name: Install Crawler dependencies
        working-directory: ./crawler
        run: npm ci

      - name: Run Tests with Coverage
        working-directory: ./api-client
        run: npm run test:coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api-client/coverage/
          retention-days: 7

  generate-automated-report:
    name: Generate Live Benchmarks & Report
    runs-on: ubuntu-latest
    needs: test-and-coverage
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Crawler dependencies
        working-directory: ./crawler
        run: npm ci

      - name: Install API Client dependencies
        working-directory: ./api-client
        run: npm ci

      - name: Generate Automated CI Report
        run: node scripts/generate-ci-report.js
        env:
          NODE_OPTIONS: "--no-warnings"

      # Instead of pushing, upload as artifact
      - name: Upload Updated REPORT.md
        uses: actions/upload-artifact@v4
        with:
          name: report-with-ci-metrics
          path: REPORT.md
          retention-days: 7

      - name: Display Report Summary
        run: |
          echo "✅ CI Report generated successfully!"
          echo "📊 The updated REPORT.md with coverage metrics has been uploaded as an artifact."
          echo "📥 Download it from the 'Artifacts' section of this workflow run."
          
  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Validating project structure..."
          test -f crawler/mock-server.js && echo "✓ mock-server.js"
          test -f crawler/crawler-bounded.js && echo "✓ crawler-bounded.js"
          test -f api-client/rate-limiter.js && echo "✓ rate-limiter.js"
          test -f api-client/client.js && echo "✓ client.js"
          test -f bonus/server.js && echo "✓ bonus/server.js"
          test -f REPORT.md && echo "✓ REPORT.md"
          echo "✅ All required files present!"